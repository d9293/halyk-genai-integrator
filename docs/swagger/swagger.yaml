  /internal/v1/submissions/{attemptId}/outcome:
    post:
      consumes:
      - application/json
      description: 'For worker.Request. ACCEPTED: AI took the task; it keeps its AI
        place and will be polled. UNKNOWN: no reliable answer; AI may have the task,
        so it keeps its place and polling finds out. Never re-send it yourself. REJECTED:
        AI clearly refused; the place is freed and the task fails.'
      parameters:
      - description: attemptId from the claim response
        format: uuid
        in: path
        name: attemptId
        required: true
        type: string
      - description: Outcome
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/submission.OutcomeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.AppliedResponse'
        "400":
          description: MALFORMED_JSON, VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: ATTEMPT_NOT_FOUND
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'CLAIM_LOST: wrong or expired claim token'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: SERVICE_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Report what happened when sending to AI
      tags:
      - submissions (worker)
  /internal/v1/submissions/{attemptId}/renew:
    post:
      consumes:
      - application/json
      description: 'For worker.Request. Heartbeat while the call to AI is in progress:
        extends claimUntil. On 409 stop: the claim expired and the attempt is being
        treated as UNKNOWN.'
      parameters:
      - description: attemptId from the claim response
        format: uuid
        in: path
        name: attemptId
        required: true
        type: string
      - description: Claim to extend
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpx.RenewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.RenewResponse'
        "400":
          description: MALFORMED_JSON, VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: ATTEMPT_NOT_FOUND
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: CLAIM_LOST
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: SERVICE_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Extend a submission claim
      tags:
      - submissions (worker)
  /internal/v1/submissions/claim:
    post:
      consumes:
      - application/json
      description: For worker.Request. Hands out tasks that are ready to be sent to
        AI, each as a new attempt that already holds one of the limited AI places.
        Send it to AI with attemptId as task_id, then report the outcome. Returns
        an empty list when nothing is ready or all AI places are taken; ask again
        later.
      parameters:
