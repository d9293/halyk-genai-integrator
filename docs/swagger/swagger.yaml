basePath: /
definitions:
  document.ClaimResponse:
    properties:
      items:
        description: Empty when there is nothing to copy.
        items:
          $ref: '#/definitions/github_com_d9293_halyk-genai-integrator_internal_handler_http_document.ClaimedDocument'
        type: array
    type: object
  document.CompleteRequest:
    properties:
      checksumSha256:
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        type: string
      claimToken:
        example: claimToken-from-the-claim-response
        format: uuid
        type: string
      s3Uri:
        description: Link to the copy in S3 that AI will receive.
        example: s3://ai-input/tasks/aaaaaaaa/0
        maxLength: 8192
        type: string
      sizeBytes:
        example: 123456
        minimum: 0
        type: integer
    required:
    - checksumSha256
    - claimToken
    - s3Uri
    - sizeBytes
    type: object
  document.FailureRequest:
    properties:
      claimToken:
        example: claimToken-from-the-claim-response
        format: uuid
        type: string
      code:
        description: Short machine-readable reason.
        example: SOURCE_UNAVAILABLE
        maxLength: 100
        type: string
      message:
        description: Human-readable details. No personal data or signed URLs.
        example: Attstore returned 503
        maxLength: 2000
        type: string
      retryable:
        description: Whether trying again later may help. The API applies its own
          retry limit.
        example: true
        type: boolean
    required:
    - claimToken
    - code
    - message
    - retryable
    type: object
  github_com_d9293_halyk-genai-integrator_internal_handler_http_document.ClaimedDocument:
    properties:
      attstoreUrl:
        description: Where to download the file from.
        example: https://attstore.example/documents/1
        type: string
      bpmDocumentId:
        description: BPM's ID of the file, for logging only. Not accepted in the URLs.
        example: 22222222-2222-4222-8222-222222222222
        format: uuid
        type: string
      claimToken:
        description: Proof of ownership; send it back with every call about this document.
        example: 7b1e2c3d-0000-4000-8000-000000000001
        format: uuid
        type: string
      claimUntil:
        description: Ownership expires at this time unless renewed.
        example: "2026-10-15T08:01:00Z"
        type: string
      id:
        description: Use this id in /documents/{id}/complete, /failure and /renew.
        example: 286a795c-37bf-4ea3-9c85-47c886cf3f2a
        format: uuid
        type: string
      position:
        description: Index of the file in the task; AI receives files in this order.
        example: 0
        type: integer
      requestGuid:
        example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        format: uuid
        type: string
    type: object
  github_com_d9293_halyk-genai-integrator_internal_handler_http_poll.ClaimedPoll:
    properties:
      attemptId:
        description: Use in /polls/{attemptId}/observation. It is the task_id AI knows
          the task by.
        example: a77e0000-0000-4000-8000-000000000002
        format: uuid
        type: string
      attemptNo:
        description: 1 for the first send of the task, 2 for a re-send after AI lost
          it, ...
        example: 1
        type: integer
      claimToken:
        description: Proof of ownership; send it back with the observation.
        example: 7b1e2c3d-0000-4000-8000-000000000001
        format: uuid
        type: string
      claimUntil:
        description: Report the observation before this time.
        example: "2026-10-16T08:00:30Z"
        type: string
      operation:
        description: Tells which AI status endpoint to call.
        enum:
        - SOCIAL_MEDIA
        - REGISTER_COMPARE
        example: REGISTER_COMPARE
        type: string
      requestGuid:
        example: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
        format: uuid
        type: string
      requestId:
        example: 11111111-1111-4111-8111-111111111111
        format: uuid
        type: string
    type: object
  github_com_d9293_halyk-genai-integrator_internal_handler_http_submission.ClaimedSubmission:
    properties:
      attemptId:
        description: Use in /submissions/{attemptId}/outcome and /renew. Send it to
          AI as task_id.
        example: a77e0000-0000-4000-8000-000000000001
        format: uuid
        type: string
      attemptNo:
        description: 1 for the first send of the task, 2 for a re-send after AI lost
          it, ...
        example: 1
        type: integer
      claimToken:
        description: Proof of ownership; send it back with outcome and renew.
        example: 7b1e2c3d-0000-4000-8000-000000000001
        format: uuid
        type: string
      claimUntil:
        description: Report the outcome before this time, or renew.
        example: "2026-10-15T08:01:00Z"
        type: string
      documents:
        description: S3 copies of the task's files, in the order AI must receive them.
          Empty for operations without files.
        items:
          $ref: '#/definitions/github_com_d9293_halyk-genai-integrator_internal_handler_http_submission.SubmissionDocument'
        type: array
      input:
        description: Operation input as registered by BPM, already normalized.
        type: object
      operation:
        enum:
        - SOCIAL_MEDIA
        - REGISTER_COMPARE
        example: REGISTER_COMPARE
        type: string
      requestGuid:
        example: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
        format: uuid
        type: string
      requestId:
        example: 11111111-1111-4111-8111-111111111111
        format: uuid
        type: string
    type: object
  github_com_d9293_halyk-genai-integrator_internal_handler_http_submission.SubmissionDocument:
    properties:
      position:
        example: 0
        type: integer
      s3Uri:
        example: s3://ai-input/tasks/bbbbbbbb/0
        type: string
    type: object
  httpx.AppliedResponse:
    properties:
      applied:
        example: true
        type: boolean
    type: object
  httpx.ClaimRequest:
    properties:
      limit:
        description: How many items to take at most.
        example: 1
        maximum: 10
        minimum: 1
        type: integer
      workerId:
        description: Name of the worker pod, e.g. its HOSTNAME. For diagnostics only.
        example: worker-request-7d9f8c6b5-x2kqp
        maxLength: 200
        type: string
    required:
    - limit
    - workerId
    type: object
  httpx.ErrorDetail:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      fields:
        items:
          $ref: '#/definitions/httpx.FieldError'
        type: array
      message:
        example: Некорректный запрос
        type: string
      retryable:
        description: Retryable means the same HTTP command may be repeated, not that
          AI work may be restarted.
        example: false
        type: boolean
    type: object
  httpx.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httpx.ErrorDetail'
      traceId:
        description: TraceID is null until tracing is wired in.
        type: string
        x-nullable: true
    type: object
  httpx.FailureInput:
    properties:
      code:
        description: Short machine-readable reason.
        example: AI_TIMEOUT
        maxLength: 100
        type: string
      message:
        description: Human-readable details. No personal data, raw HTML or signed
          URLs.
        example: No response from AI within 30s
        maxLength: 2000
        type: string
    required:
    - code
    - message
    type: object
  httpx.FieldError:
    properties:
      code:
        example: INVALID_FORMAT
        type: string
      path:
        example: input.iin
        type: string
    type: object
  httpx.RenewRequest:
    properties:
      claimToken:
        example: claimToken-from-the-claim-response
        format: uuid
        type: string
    required:
    - claimToken
    type: object
  httpx.RenewResponse:
    properties:
      claimUntil:
        example: "2026-10-15T08:02:00Z"
        type: string
    type: object
  poll.ClaimResponse:
    properties:
      items:
        description: Empty when no status check is due.
        items:
          $ref: '#/definitions/github_com_d9293_halyk-genai-integrator_internal_handler_http_poll.ClaimedPoll'
        type: array
    type: object
  poll.ObservationRequest:
    properties:
      claimToken:
        example: claimToken-from-the-claim-response
        format: uuid
        type: string
      failure:
        allOf:
        - $ref: '#/definitions/httpx.FailureInput'
        description: Required for FAILED and TECHNICAL_ERROR, not allowed otherwise.
      outcome:
        description: |-
          What AI answered:
          QUEUED / PROCESSING: AI has the task and is not done.
          SUCCEEDED: AI finished; put AI's result JSON in result.
          FAILED: AI finished with a business error; describe it in failure.
          NOT_FOUND: AI confirmed it does not know this task.
          TECHNICAL_ERROR: no usable answer (timeout, 5xx, proxy 404); describe it in failure.
        enum:
        - QUEUED
        - PROCESSING
        - SUCCEEDED
        - FAILED
        - NOT_FOUND
        - TECHNICAL_ERROR
        example: SUCCEEDED
        type: string
      result:
        description: AI's result JSON as AI returned it. Required for SUCCEEDED, not
          allowed otherwise.
        type: object
    required:
    - claimToken
    - outcome
    type: object
  submission.ClaimResponse:
    properties:
      items:
        description: Empty when nothing is ready or all AI places are taken.
        items:
          $ref: '#/definitions/github_com_d9293_halyk-genai-integrator_internal_handler_http_submission.ClaimedSubmission'
        type: array
    type: object
  submission.OutcomeRequest:
    properties:
      claimToken:
        example: claimToken-from-the-claim-response
        format: uuid
        type: string
      failure:
        allOf:
        - $ref: '#/definitions/httpx.FailureInput'
        description: Required for REJECTED, optional for UNKNOWN, not allowed for
          ACCEPTED.
      outcome:
        description: |-
          ACCEPTED: AI confirmed it took the task.
          UNKNOWN: no reliable answer (timeout, lost response, unexpected reply); AI may have it.
          REJECTED: AI clearly refused the task.
        enum:
        - ACCEPTED
        - UNKNOWN
        - REJECTED
        example: ACCEPTED
        type: string
      remoteStatus:
        description: 'Only for ACCEPTED: AI''s status of the task. Defaults to QUEUED.'
        enum:
        - QUEUED
        - PROCESSING
        example: QUEUED
        type: string
    required:
    - claimToken
    - outcome
    type: object
  task.CreateTaskRequest:
    properties:
      documents:
        description: |-
          Empty array for operations without files. REGISTER_COMPARE: exactly two.
          Order matters: AI results refer to files by position (only_a = first, only_b = second).
        items:
          $ref: '#/definitions/task.DocumentInput'
        type: array
      input:
        description: |-
          Operation-specific JSON object.
          SOCIAL_MEDIA: {"iin": "<12 digits>", "fullName": "<1..500 chars>"}.
          REGISTER_COMPARE: {"adjudicate": true}.
        type: object
      operation:
        enum:
        - SOCIAL_MEDIA
        - REGISTER_COMPARE
        example: SOCIAL_MEDIA
        type: string
      requestGuid:
        description: Unique ID of this task. Reuse it when retrying the same task.
        example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        format: uuid
        type: string
      requestId:
        description: Camunda request the task belongs to; several tasks can share
          it.
        example: 11111111-1111-4111-8111-111111111111
        format: uuid
        type: string
    required:
    - documents
    - input
    - operation
    - requestGuid
    - requestId
    type: object
  task.CreateTaskResponse:
    properties:
      createdAt:
        example: "2026-10-13T08:00:00Z"
        type: string
      operation:
        example: SOCIAL_MEDIA
        type: string
      requestGuid:
        example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        format: uuid
        type: string
      requestId:
        example: 11111111-1111-4111-8111-111111111111
        format: uuid
        type: string
      status:
        enum:
        - WAITING_DOCUMENTS
        - READY_TO_SUBMIT
        example: READY_TO_SUBMIT
        type: string
    type: object
  task.DocumentInput:
    properties:
      attstoreUrl:
        example: https://attstore.example/documents/1
        maxLength: 8192
        type: string
      documentId:
        description: Unique within one task.
        example: 22222222-2222-4222-8222-222222222222
        format: uuid
        type: string
    required:
    - attstoreUrl
    - documentId
    type: object
  task.Failure:
    properties:
      code:
        example: AI_TASK_LOST_RETRIES_EXHAUSTED
        type: string
      message:
        type: string
    type: object
  task.TaskView:
    properties:
      completedAt:
        type: string
        x-nullable: true
      createdAt:
        example: "2026-10-13T08:00:00Z"
        type: string
      error:
        allOf:
        - $ref: '#/definitions/task.Failure'
        description: Set when the task is FAILED or NEEDS_ATTENTION.
        x-nullable: true
      operation:
        example: SOCIAL_MEDIA
        type: string
      requestGuid:
        example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        format: uuid
        type: string
      requestId:
        example: 11111111-1111-4111-8111-111111111111
        format: uuid
        type: string
      result:
        description: AI result JSON as AI returned it; null until the task succeeds.
        type: object
        x-nullable: true
      status:
        enum:
        - WAITING_DOCUMENTS
        - PREPARING_DOCUMENTS
        - READY_TO_SUBMIT
        - SUBMITTING
        - SUBMISSION_UNKNOWN
        - REMOTE_QUEUED
        - REMOTE_RUNNING
        - NEEDS_ATTENTION
        - SUCCEEDED
        - FAILED
        example: READY_TO_SUBMIT
        type: string
      updatedAt:
        example: "2026-10-13T08:00:00Z"
        type: string
    type: object
info:
  contact: {}
  description: Регистрация и чтение задач BPM.
  title: Integrator.Api
  version: "1.0"
paths:
  /api/v1/tasks:
    post:
      consumes:
      - application/json
      description: Сохраняет задачу BPM и возвращает 202 после commit. Повтор с тем
        же requestGuid и теми же данными возвращает 200 и текущее состояние; другой
        вход — 409 IDEMPOTENCY_CONFLICT.
      parameters:
      - description: Task
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/task.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Same task already registered
          schema:
            $ref: '#/definitions/task.CreateTaskResponse'
        "202":
          description: Task registered
          headers:
            Location:
              description: /api/v1/tasks/{requestGuid}
              type: string
          schema:
            $ref: '#/definitions/task.CreateTaskResponse'
        "400":
          description: MALFORMED_JSON, VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: IDEMPOTENCY_CONFLICT, REQUEST_GUID_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "413":
          description: BODY_TOO_LARGE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "422":
          description: OPERATION_NOT_ENABLED, VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: 'SERVICE_UNAVAILABLE: database unreachable, retry with the
            same body'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register task
      tags:
      - tasks
  /api/v1/tasks/{requestGuid}:
    get:
      description: Текущее состояние задачи, результат и ссылки на отчёты.
      parameters:
      - description: Request GUID
        format: uuid
        in: path
        name: requestGuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.TaskView'
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: SERVICE_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get task
      tags:
      - tasks
  /internal/v1/documents/{id}/complete:
    post:
      consumes:
      - application/json
      description: For worker.Request. The document was copied to S3. When it is the
        task's last document, the task becomes ready to be sent to AI. Repeating the
        call with the same data returns 200 again.
      parameters:
      - description: id from the claim response (not bpmDocumentId)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Copy result
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/document.CompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.AppliedResponse'
        "400":
          description: MALFORMED_JSON, VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: DOCUMENT_NOT_FOUND
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'CLAIM_LOST: wrong or expired claim token; drop the work'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: SERVICE_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Report a copied document
      tags:
      - documents (worker)
  /internal/v1/documents/{id}/failure:
    post:
      consumes:
      - application/json
      description: For worker.Request. The document could not be copied. A retryable
        failure is tried again later with backoff; a permanent one, or too many failures,
        puts the document and its task into NEEDS_ATTENTION.
      parameters:
      - description: id from the claim response (not bpmDocumentId)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Failure
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/document.FailureRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.AppliedResponse'
        "400":
          description: MALFORMED_JSON, VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: DOCUMENT_NOT_FOUND
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'CLAIM_LOST: wrong or expired claim token; drop the work'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: SERVICE_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Report a failed copy
      tags:
      - documents (worker)
  /internal/v1/documents/{id}/renew:
    post:
      consumes:
      - application/json
      description: 'For worker.Request. Heartbeat while copying: extends claimUntil.
        Call it about every quarter of the claim time. On 409 stop copying: the claim
        expired or belongs to someone else.'
      parameters:
      - description: id from the claim response (not bpmDocumentId)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Claim to extend
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpx.RenewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.RenewResponse'
        "400":
          description: MALFORMED_JSON, VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: DOCUMENT_NOT_FOUND
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: CLAIM_LOST
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: SERVICE_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Extend a document claim
      tags:
      - documents (worker)
  /internal/v1/documents/claim:
    post:
      consumes:
      - application/json
      description: For worker.Request. Hands out documents that must be copied from
        Attstore to S3 before the task can be sent to AI. Each document is owned by
        the caller until claimUntil; extend it with /documents/{id}/renew while copying.
        Returns an empty list when there is nothing to copy.
      parameters:
      - description: Claim
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpx.ClaimRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/document.ClaimResponse'
        "400":
          description: MALFORMED_JSON, VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: SERVICE_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Claim documents to copy
      tags:
      - documents (worker)
  /internal/v1/polls/{attemptId}/observation:
    post:
      consumes:
      - application/json
      description: 'For worker.Response. QUEUED / PROCESSING: checked again later.
        SUCCEEDED: the result is stored and the task succeeds. FAILED: the task fails.
        Both free the AI place. NOT_FOUND: AI does not know the task; several in a
        row mean AI lost it and the API sends it again. TECHNICAL_ERROR: checked again
        later, never treated as NOT_FOUND. Repeating QUEUED/PROCESSING/SUCCEEDED/FAILED
        after a lost response returns 200 again; repeating NOT_FOUND or TECHNICAL_ERROR
        returns 409.'
      parameters:
      - description: attemptId from the claim response
        format: uuid
        in: path
        name: attemptId
        required: true
        type: string
      - description: Observation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/poll.ObservationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.AppliedResponse'
        "400":
          description: MALFORMED_JSON, VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: ATTEMPT_NOT_FOUND
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: 'CLAIM_LOST: wrong or expired claim token, or already applied'
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: SERVICE_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Report what AI answered
      tags:
      - polls (worker)
  /internal/v1/polls/claim:
    post:
      consumes:
      - application/json
      description: For worker.Response. Hands out tasks at AI whose status is due
        to be checked. For each, make one GET to AI with attemptId as task_id and
        report the answer before claimUntil. Returns an empty list when no check is
        due; ask again later.
      parameters:
      - description: Claim
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpx.ClaimRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
