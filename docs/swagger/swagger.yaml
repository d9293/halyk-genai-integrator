          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: SERVICE_UNAVAILABLE
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Claim tasks to send to AI
      tags:
      - submissions (worker)
